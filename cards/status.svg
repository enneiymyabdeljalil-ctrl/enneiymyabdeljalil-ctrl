<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="118" viewBox="0 0 1000 118"><style>
    text{font-family:Inter,Arial,sans-serif}
    .reveal{opacity:0;animation:rise .75s ease-out .15s forwards}
    .reveal2{opacity:0;animation:rise .75s ease-out .35s forwards}
    .pulse{animation:pulse 2s ease-in-out infinite}
    .cursor{animation:blink 1s steps(2,start) infinite}
    @keyframes rise{to{opacity:1;transform:translateY(0)}from{opacity:0;transform:translateY(12px)}}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
    @keyframes blink{50%{opacity:0}}
    @media(prefers-reduced-motion:reduce){.reveal,.reveal2,.pulse,.cursor{animation:none!important;opacity:1!important;transform:none!important}}
    </style><defs><linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14243a"/><stop offset="1" stop-color="#0b1220"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5ee7f5"/><stop offset="1" stop-color="#a78bfa"/></linearGradient><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#7690ae" opacity=".18"/></pattern></defs><rect width="1000" height="118" rx="24" fill="#080d18"/><rect x="2" y="2" width="996" height="114" rx="20" fill="url(#panel)" stroke="#27364c"/><g class="reveal"><text x="30" y="43" fill="#5ee7f5" font-size="10" font-weight="700" letter-spacing="1.2">01  /  STATUS</text><text x="30" y="78" fill="#f1f5f9" font-size="19" font-weight="650" letter-spacing="0">Student developer</text></g><g class="reveal"><text x="354" y="43" fill="#60a5fa" font-size="10" font-weight="700" letter-spacing="1.2">02  /  ENVIRONMENT</text><text x="354" y="78" fill="#f1f5f9" font-size="19" font-weight="650" letter-spacing="0">OFPPT · Morocco</text></g><g class="reveal"><text x="678" y="43" fill="#a78bfa" font-size="10" font-weight="700" letter-spacing="1.2">03  /  METHOD</text><text x="678" y="78" fill="#f1f5f9" font-size="19" font-weight="650" letter-spacing="0">Learn → Build → Improve</text></g><path d="M320 25 V92 M644 25 V92" stroke="#27364c"/></svg>
