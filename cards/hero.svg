<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330"><style>
    text{font-family:Inter,Arial,sans-serif}
    .reveal{opacity:0;animation:rise .75s ease-out .15s forwards}
    .reveal2{opacity:0;animation:rise .75s ease-out .35s forwards}
    .pulse{animation:pulse 2s ease-in-out infinite}
    .cursor{animation:blink 1s steps(2,start) infinite}
    @keyframes rise{to{opacity:1;transform:translateY(0)}from{opacity:0;transform:translateY(12px)}}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
    @keyframes blink{50%{opacity:0}}
    @media(prefers-reduced-motion:reduce){.reveal,.reveal2,.pulse,.cursor{animation:none!important;opacity:1!important;transform:none!important}}
    </style><defs><linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14243a"/><stop offset="1" stop-color="#0b1220"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5ee7f5"/><stop offset="1" stop-color="#a78bfa"/></linearGradient><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#7690ae" opacity=".18"/></pattern></defs><rect width="1000" height="330" rx="24" fill="#080d18"/><rect x="2" y="2" width="996" height="326" rx="24" fill="url(#panel)" stroke="#2b405b"/><rect x="2" y="2" width="996" height="326" rx="24" fill="url(#dots)"/><circle cx="890" cy="82" r="112" fill="#5ee7f5" opacity=".045"/><circle cx="920" cy="270" r="150" fill="#a78bfa" opacity=".055"/><g class="reveal"><text x="42" y="52" fill="#5ee7f5" font-size="12" font-weight="700" letter-spacing="1.8">ABDELJALIL ENNEIYMY  /  DEVELOPER PROFILE</text><text x="42" y="119" fill="#f1f5f9" font-size="43" font-weight="750" letter-spacing="0">Building the web,</text><text x="42" y="169" fill="#f1f5f9" font-size="43" font-weight="750" letter-spacing="0">one project at a time.</text><text x="44" y="215" fill="#cbd5e1" font-size="19" font-weight="600" letter-spacing="0">Full-Stack Development Student</text><text x="44" y="249" fill="#9aa9bd" font-size="14" font-weight="400" letter-spacing="0">OFPPT  ·  Morocco  ·  Learning by building</text><rect x="43" y="278" width="190" height="29" rx="14" fill="#0b2632" stroke="#1e5966"/><circle class="pulse" cx="60" cy="292" r="4" fill="#5ee7f5"/><text x="73" y="297" fill="#5ee7f5" font-size="10" font-weight="700" letter-spacing="1">CURRENTLY LEARNING</text></g><g class="reveal2"><rect x="620" y="35" width="337" height="260" rx="17" fill="#0b1220" stroke="#30435c"/><path d="M620 76 H957" stroke="#26364b"/><circle cx="643" cy="56" r="5" fill="#fb7185"/><circle cx="661" cy="56" r="5" fill="#fbbf24"/><circle cx="679" cy="56" r="5" fill="#4ade80"/><text x="704" y="60" fill="#9aa9bd" font-size="12" font-weight="600" letter-spacing="0">abdeljalil@dev  ~</text><text x="645" y="112" fill="#5ee7f5" font-size="13" font-weight="600" letter-spacing="0">$ whoami</text><text x="645" y="143" fill="#f1f5f9" font-size="14" font-weight="400" letter-spacing="0">full-stack developer in training</text><text x="645" y="185" fill="#5ee7f5" font-size="13" font-weight="600" letter-spacing="0">$ stack --now</text><text x="645" y="214" fill="#dbeafe" font-size="13" font-weight="400" letter-spacing="0">React   Redux   JavaScript</text><text x="645" y="239" fill="#dbeafe" font-size="13" font-weight="400" letter-spacing="0">PHP     MySQL    MongoDB</text><text x="645" y="273" fill="#5ee7f5" font-size="13" font-weight="600" letter-spacing="0">$ build --keep-going</text><rect class="cursor" x="830" y="261" width="8" height="15" rx="1" fill="#5ee7f5"/></g></svg>
