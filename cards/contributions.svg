<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="190" viewBox="0 0 1000 190"><style>text{font-family:Inter,Arial,sans-serif}.reveal{opacity:0;animation:rise .7s ease-out .2s forwards}@keyframes rise{to{opacity:1;transform:translateY(0)}from{opacity:0;transform:translateY(10px)}}@media(prefers-reduced-motion:reduce){.reveal{animation:none!important;opacity:1!important}}</style><defs><linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14243a"/><stop offset="1" stop-color="#0b1220"/></linearGradient><pattern id="cells" width="17" height="14" patternUnits="userSpaceOnUse"><rect width="11" height="10" rx="2" fill="#19283a"/></pattern></defs><rect width="1000" height="190" rx="24" fill="#080d18"/><rect x="2" y="2" width="996" height="186" rx="20" fill="url(#panel)" stroke="#27364c"/><g class="reveal"><text x="28" y="34" fill="#5ee7f5" font-size="11" font-weight="700" letter-spacing="1.8">CONTRIBUTION MAP</text><text x="28" y="56" fill="#f1f5f9" font-size="13">Daily activity · last 365 days</text><rect x="29" y="75" width="884" height="98" fill="url(#cells)"/><text x="30" y="179" fill="#9aa9bd" font-size="9" font-weight="600" letter-spacing="1">LESS</text><text x="910" y="179" fill="#9aa9bd" font-size="9" font-weight="600" letter-spacing="1">MORE</text></g></svg>