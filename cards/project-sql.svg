<svg xmlns="http://www.w3.org/2000/svg" width="500" height="190" viewBox="0 0 500 190"><style>
    text{font-family:Inter,Arial,sans-serif}
    .reveal{opacity:0;animation:rise .75s ease-out .15s forwards}
    .reveal2{opacity:0;animation:rise .75s ease-out .35s forwards}
    .pulse{animation:pulse 2s ease-in-out infinite}
    .cursor{animation:blink 1s steps(2,start) infinite}
    @keyframes rise{to{opacity:1;transform:translateY(0)}from{opacity:0;transform:translateY(12px)}}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
    @keyframes blink{50%{opacity:0}}
    @media(prefers-reduced-motion:reduce){.reveal,.reveal2,.pulse,.cursor{animation:none!important;opacity:1!important;transform:none!important}}
    </style><defs><linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14243a"/><stop offset="1" stop-color="#0b1220"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5ee7f5"/><stop offset="1" stop-color="#a78bfa"/></linearGradient><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#7690ae" opacity=".18"/></pattern></defs><rect width="500" height="190" rx="24" fill="#080d18"/><a href="https://github.com/enneiymyabdeljalil-ctrl/DATABASE_SQL-"><rect x="2" y="2" width="496" height="186" rx="18" fill="#101a2b" stroke="#27364c"/><rect x="2" y="2" width="5" height="186" rx="2" fill="#a78bfa"/><g class="reveal"><text x="27" y="35" fill="#a78bfa" font-size="10" font-weight="700" letter-spacing="1.5">DATABASE PRACTICE</text><text x="27" y="78" fill="#f1f5f9" font-size="25" font-weight="700" letter-spacing="0">DATABASE_SQL-</text><text x="27" y="111" fill="#9aa9bd" font-size="12" font-weight="400" letter-spacing="0">SQL database exercises and query practice</text><rect x="27" y="132" width="175" height="29" rx="14" fill="#19283d"/><text x="41" y="151" fill="#d7e5f5" font-size="11" font-weight="600" letter-spacing="0">SQL · MySQL</text><text x="355" y="166" fill="#a78bfa" font-size="10" font-weight="700" letter-spacing="0.8">VIEW REPO  ↗</text></g></a></svg>
