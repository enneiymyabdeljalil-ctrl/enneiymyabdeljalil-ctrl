<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="198" viewBox="0 0 1000 198"><style>
    text{font-family:Inter,Arial,sans-serif}
    .reveal{opacity:0;animation:rise .75s ease-out .15s forwards}
    .reveal2{opacity:0;animation:rise .75s ease-out .35s forwards}
    .pulse{animation:pulse 2s ease-in-out infinite}
    .cursor{animation:blink 1s steps(2,start) infinite}
    @keyframes rise{to{opacity:1;transform:translateY(0)}from{opacity:0;transform:translateY(12px)}}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
    @keyframes blink{50%{opacity:0}}
    @media(prefers-reduced-motion:reduce){.reveal,.reveal2,.pulse,.cursor{animation:none!important;opacity:1!important;transform:none!important}}
    </style><defs><linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14243a"/><stop offset="1" stop-color="#0b1220"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5ee7f5"/><stop offset="1" stop-color="#a78bfa"/></linearGradient><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#7690ae" opacity=".18"/></pattern></defs><rect width="1000" height="198" rx="24" fill="#080d18"/><text x="24" y="32" fill="#5ee7f5" font-size="11" font-weight="700" letter-spacing="2">TECH STACK</text><text x="24" y="57" fill="#f1f5f9" font-size="16" font-weight="600" letter-spacing="0">Technologies and tools I'm practicing</text><rect x="24" y="76" width="226" height="106" rx="18" fill="#101a2b" stroke="#27364c"/><g class="reveal2"><text x="40" y="101" fill="#5ee7f5" font-size="10" font-weight="700" letter-spacing="0">01</text><text x="40" y="126" fill="#9aa9bd" font-size="11" font-weight="700" letter-spacing="1.1">FRONTEND</text><text x="40" y="151" fill="#f1f5f9" font-size="12" font-weight="600" letter-spacing="0">HTML · CSS · JS</text><text x="40" y="168" fill="#f1f5f9" font-size="12" font-weight="600" letter-spacing="0">React · Redux</text></g><rect x="266" y="76" width="226" height="106" rx="18" fill="#101a2b" stroke="#27364c"/><g class="reveal2"><text x="282" y="101" fill="#60a5fa" font-size="10" font-weight="700" letter-spacing="0">02</text><text x="282" y="126" fill="#9aa9bd" font-size="11" font-weight="700" letter-spacing="1.1">BACKEND</text><text x="282" y="151" fill="#f1f5f9" font-size="12" font-weight="600" letter-spacing="0">PHP</text></g><rect x="508" y="76" width="226" height="106" rx="18" fill="#101a2b" stroke="#27364c"/><g class="reveal2"><text x="524" y="101" fill="#a78bfa" font-size="10" font-weight="700" letter-spacing="0">03</text><text x="524" y="126" fill="#9aa9bd" font-size="11" font-weight="700" letter-spacing="1.1">DATABASES</text><text x="524" y="151" fill="#f1f5f9" font-size="12" font-weight="600" letter-spacing="0">MySQL</text><text x="524" y="168" fill="#f1f5f9" font-size="12" font-weight="600" letter-spacing="0">MongoDB</text></g><rect x="750" y="76" width="226" height="106" rx="18" fill="#101a2b" stroke="#27364c"/><g class="reveal2"><text x="766" y="101" fill="#4ade80" font-size="10" font-weight="700" letter-spacing="0">04</text><text x="766" y="126" fill="#9aa9bd" font-size="11" font-weight="700" letter-spacing="1.1">WORKFLOW</text><text x="766" y="151" fill="#f1f5f9" font-size="12" font-weight="600" letter-spacing="0">Git</text><text x="766" y="168" fill="#f1f5f9" font-size="12" font-weight="600" letter-spacing="0">GitHub</text></g></svg>
