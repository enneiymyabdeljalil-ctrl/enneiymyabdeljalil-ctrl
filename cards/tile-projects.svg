<svg xmlns="http://www.w3.org/2000/svg" width="320" height="130" viewBox="0 0 320 130"><style>text{font-family:Inter,Arial,sans-serif}.enter{opacity:0;animation:rise .8s ease-out .2s forwards}@keyframes rise{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){.enter{animation:none!important;opacity:1!important;transform:none!important}}</style><rect width="100%" height="100%" rx="22" fill="#08111f"/><rect x="2" y="2" width="316" height="126" rx="18" fill="#101e31" stroke="#a78bfa" stroke-opacity=".65"/><g class="enter"><text x="25" y="52" fill="#e5f3ff" font-size="22" font-weight="700">PROJECTS</text><text x="25" y="86" fill="#91a7bd" font-size="13" font-weight="400">Explore public repositories</text><text x="278" y="110" fill="#a78bfa" font-size="18" font-weight="700">↗</text></g></svg>
