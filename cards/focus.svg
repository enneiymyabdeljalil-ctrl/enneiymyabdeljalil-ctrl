<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="226" viewBox="0 0 1000 226"><style>
    text{font-family:Inter,Arial,sans-serif}
    .reveal{opacity:0;animation:rise .75s ease-out .15s forwards}
    .reveal2{opacity:0;animation:rise .75s ease-out .35s forwards}
    .pulse{animation:pulse 2s ease-in-out infinite}
    .cursor{animation:blink 1s steps(2,start) infinite}
    @keyframes rise{to{opacity:1;transform:translateY(0)}from{opacity:0;transform:translateY(12px)}}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
    @keyframes blink{50%{opacity:0}}
    @media(prefers-reduced-motion:reduce){.reveal,.reveal2,.pulse,.cursor{animation:none!important;opacity:1!important;transform:none!important}}
    </style><defs><linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14243a"/><stop offset="1" stop-color="#0b1220"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5ee7f5"/><stop offset="1" stop-color="#a78bfa"/></linearGradient><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#7690ae" opacity=".18"/></pattern></defs><rect width="1000" height="226" rx="24" fill="#080d18"/><text x="24" y="31" fill="#5ee7f5" font-size="11" font-weight="700" letter-spacing="2">CURRENT FOCUS</text><text x="24" y="57" fill="#f1f5f9" font-size="18" font-weight="650" letter-spacing="0">What I'm practicing right now</text><rect x="24" y="76" width="306" height="132" rx="18" fill="#101a2b" stroke="#27364c"/><g class="reveal2"><text x="42" y="103" fill="#5ee7f5" font-size="11" font-weight="700" letter-spacing="0">01</text><text x="42" y="133" fill="#9aa9bd" font-size="12" font-weight="700" letter-spacing="1.3">FRONTEND</text><text x="42" y="164" fill="#f1f5f9" font-size="17" font-weight="650" letter-spacing="0">React · Redux · JavaScript</text><text x="42" y="190" fill="#9aa9bd" font-size="11" font-weight="400" letter-spacing="0">Build interfaces and manage state</text></g><rect x="347" y="76" width="306" height="132" rx="18" fill="#101a2b" stroke="#27364c"/><g class="reveal2"><text x="365" y="103" fill="#60a5fa" font-size="11" font-weight="700" letter-spacing="0">02</text><text x="365" y="133" fill="#9aa9bd" font-size="12" font-weight="700" letter-spacing="1.3">BACKEND</text><text x="365" y="164" fill="#f1f5f9" font-size="17" font-weight="650" letter-spacing="0">PHP · MySQL</text><text x="365" y="190" fill="#9aa9bd" font-size="11" font-weight="400" letter-spacing="0">Practice server-side logic and data</text></g><rect x="670" y="76" width="306" height="132" rx="18" fill="#101a2b" stroke="#27364c"/><g class="reveal2"><text x="688" y="103" fill="#a78bfa" font-size="11" font-weight="700" letter-spacing="0">03</text><text x="688" y="133" fill="#9aa9bd" font-size="12" font-weight="700" letter-spacing="1.3">DATABASES</text><text x="688" y="164" fill="#f1f5f9" font-size="17" font-weight="650" letter-spacing="0">SQL · MongoDB</text><text x="688" y="190" fill="#9aa9bd" font-size="11" font-weight="400" letter-spacing="0">Query, model, and organize information</text></g></svg>
