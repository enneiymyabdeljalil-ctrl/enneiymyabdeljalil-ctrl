<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="88" viewBox="0 0 1000 88" role="img" aria-label="What I'm coding and learning">
<title>What I'm coding and learning</title>
<style>
text{font-family:Inter,Arial,sans-serif}
.label{opacity:0;animation:enter .7s ease-out .15s forwards}
.line{stroke-dasharray:900;stroke-dashoffset:900;animation:draw 1.4s ease-out .35s forwards}
.dot{animation:pulse 1.8s ease-in-out infinite}
@keyframes enter{to{opacity:1;transform:translateY(0)}from{opacity:0;transform:translateY(10px)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@media(prefers-reduced-motion:reduce){.label,.line,.dot{animation:none!important;opacity:1;stroke-dashoffset:0}}
</style>
<rect width="1000" height="88" rx="18" fill="#08111f"/>
<text class="label" x="34" y="39" fill="#67e8f9" font-size="13" font-weight="700" letter-spacing="2">CURRENT FOCUS</text>
<text class="label" x="34" y="66" fill="#e5f3ff" font-size="22" font-weight="700">React · Redux · JavaScript · SQL · MongoDB</text>
<circle class="dot" cx="956" cy="42" r="7" fill="#38bdf8"/>
<path class="line" d="M34 78 H966" fill="none" stroke="#24445f" stroke-width="2"/>
</svg>
