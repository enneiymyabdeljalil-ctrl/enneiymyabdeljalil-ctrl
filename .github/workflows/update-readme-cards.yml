name: Update animated README cards

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install font tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-inter
          python -m pip install fonttools brotli
      - name: Prepare optional Inter font
        run: |
          mkdir -p assets
          FONT="$(fc-match -f '%{file}' Inter | head -n 1)"
          if [ -n "$FONT" ] && [ -f "$FONT" ]; then cp "$FONT" assets/Inter-Regular.ttf; fi
      - name: Refresh contribution JSON
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python scripts/fetch_contributions.py
      - name: Render SVG cards
        run: python scripts/render_readme_cards.py
      - name: Commit generated cards and data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards/ data/contributions.json assets/Inter-Regular.ttf
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh animated profile cards"
            git push
          fi
