name: Update Profile Signal Kit

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh contribution data when GH_PAT is configured
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -n "$GH_PAT" ]; then
            python scripts/fetch_contributions.py
          else
            echo "GH_PAT is not configured; keeping the current contribution data."
          fi

      - name: Render profile cards
        run: python scripts/render_readme_cards.py

      - name: Commit generated cards and data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards/ data/contributions.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh Profile Signal Kit cards"
            git push
          fi
